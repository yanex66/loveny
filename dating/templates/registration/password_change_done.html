{% extends 'base.html' %}

{% block title %}LOVENY - Secured{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 font-sans py-12">

    <div class="absolute -z-10 w-96 h-96 bg-green-500 rounded-full mix-blend-overlay filter blur-[120px] opacity-40 top-[-10%] left-[20%] animate-blob"></div>

    <div class="w-full max-w-sm px-6 relative z-10">
        
        <div class="bg-white/10 backdrop-blur-xl border-2 border-white/20 rounded-3xl p-10 shadow-2xl relative overflow-hidden text-center group">
            
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-green-400 via-emerald-500 to-teal-500 shadow-[0_0_15px_rgba(52,211,153,0.8)]"></div>

            <div class="relative w-24 h-24 mx-auto mb-8">
                <div class="absolute inset-0 bg-green-400 rounded-full animate-ping opacity-20"></div>
                <div class="relative w-24 h-24 bg-gradient-to-tr from-green-400 to-emerald-600 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(52,211,153,0.6)] border-4 border-black/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>
            
            <h2 class="text-3xl font-black italic tracking-tighter text-white mb-2 transform -rotate-1 drop-shadow-lg">
                SECURED!
            </h2>
            <p class="text-gray-300 text-sm font-medium leading-relaxed mb-8">
                Your password has been updated successfully. Your account is locked and loaded.
            </p>
            
            <a href="{% url 'settings' %}" class="block w-full relative overflow-hidden rounded-xl bg-white px-6 py-4 font-black text-black text-lg uppercase tracking-wider shadow-lg transition-all hover:scale-[1.02] hover:bg-green-400 hover:shadow-[0_0_30px_rgba(74,222,128,0.6)]">
                Return to Settings
            </a>

        </div>
    </div>
</div>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
        animation: blob 7s infinite;
    }
</style>
{% endblock %}
