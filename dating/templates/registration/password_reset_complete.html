{% extends 'base.html' %}

{% block title %}Password Reset Complete | LOVENY{% endblock %}

{% block content %}
<main class="flex min-h-[calc(100svh-6rem)] items-center justify-center bg-gradient-to-br from-rose-50 via-white to-orange-50 px-4 py-10 pb-32 text-slate-900">
    <section class="soft-card w-full max-w-sm rounded-3xl p-6 text-center shadow-xl shadow-pink-900/5 sm:p-8">
        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-emerald-700">
            <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m5 13 4 4L19 7"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Password reset complete</h1>
        <p class="mb-7 mt-3 text-sm leading-relaxed text-slate-600">Your new password is saved. You can now sign in to LOVENY.</p>
        <a href="{% url 'login' %}" class="block w-full rounded-2xl bg-gradient-to-r from-pink-600 to-violet-600 px-5 py-4 text-sm font-bold text-white shadow-lg shadow-pink-900/15 transition hover:scale-[1.01]">Sign in</a>
    </section>
</main>
{% endblock %}
