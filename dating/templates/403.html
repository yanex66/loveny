<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Security Check | LOVENY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 20%, #29144d 0%, #170b2c 55%, #0d061a 100%);
            min-height: 100vh;
        }
        .glow-shield {
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 text-white min-h-screen">
    <div class="w-full max-w-md text-center">
        <!-- Logo -->
        <a href="/" class="inline-flex items-center gap-2 mb-8">
            <span class="text-3xl">??</span>
            <span class="text-2xl font-black tracking-tight bg-gradient-to-r from-pink-500 via-rose-400 to-amber-300 bg-clip-text text-transparent">LOVENY</span>
        </a>

        <!-- 403/CSRF Visual Card -->
        <div class="relative rounded-3xl border border-white/10 bg-white/[0.04] p-8 backdrop-blur-2xl glow-shield shadow-2xl">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-purple-600/30 to-pink-600/30 border border-purple-500/30 text-4xl mb-4">
                ???
            </div>
            
            <div class="inline-block px-3 py-1 rounded-full bg-purple-500/20 border border-purple-500/40 text-[11px] font-black uppercase tracking-widest text-purple-300 mb-3">
                Security Verification
            </div>

            <h1 class="text-2xl font-black text-white tracking-tight mb-2">Session Refresh Required</h1>
            <p class="text-sm text-slate-300 leading-relaxed mb-6">
                Your browser's security token expired or became invalid. Reloading will securely renew your session.
            </p>

            <div class="flex flex-col gap-3">
                <button type="button" onclick="window.location.reload()" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 font-bold text-white text-sm shadow-lg shadow-purple-600/30 hover:opacity-95 active:scale-95 transition-all text-center">
                    ?? Refresh &amp; Reconnect
                </button>
                <a href="/login/" class="w-full py-3 px-6 rounded-2xl border border-white/15 bg-white/5 font-semibold text-slate-200 text-sm hover:bg-white/10 transition-all text-center">
                    Return to Log In
                </a>
                <a href="https://wa.me/2349130273282?text=Hello%20Loveny%20Support,%20I%20have%20a%20security%20token%20issue" target="_blank" rel="noopener" class="text-xs text-purple-300/80 hover:text-purple-300 font-medium pt-2 transition">
                    Need help? WhatsApp Support ?
                </a>
            </div>
        </div>

        <p class="mt-8 text-xs text-slate-500 font-medium">
            &copy; 2026 LOVENY. All rights reserved.
        </p>
    </div>
</body>
</html>
