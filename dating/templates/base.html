{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}LOVENY{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Global Reset for Dark Theme */
        body {
            background-color: #111827; /* Gray-900 */
            color: white;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Smooth Icon Transition */
        .nav-icon { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        /* Active Nav Glow */
        .nav-active {
            color: #FACC15; /* Yellow-400 */
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.6));
            transform: translateY(-4px);
        }

        /* Safe area handling */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen font-sans antialiased selection:bg-pink-500 selection:text-white {% block body_class %}{% endblock %}">
    
    <div class="min-h-screen w-full overflow-x-hidden {% if user.is_authenticated %}pb-32{% endif %}">
        {% block content %}{% endblock %}
    </div>

    {% if user.is_authenticated %}
    <div class="fixed bottom-0 left-0 right-0 p-4 pb-6 z-50 pointer-events-none">
        
        <nav class="pointer-events-auto max-w-md mx-auto bg-black/80 backdrop-blur-xl border-2 border-white/10 rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)] px-2 py-3 flex justify-around items-center relative overflow-hidden">
            
            <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>

            <a href="{% url 'swipe_card' %}" class="flex flex-col items-center p-2 rounded-xl group nav-icon {% if request.resolver_match.url_name == 'swipe_card' %}nav-active{% else %}text-gray-500 hover:text-white{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                </svg>
                <span class="text-[10px] font-bold mt-1 tracking-wider uppercase">Home</span>
            </a>

            <a href="{% url 'match_list' %}" class="flex flex-col items-center p-2 rounded-xl group nav-icon {% if request.resolver_match.url_name == 'match_list' %}nav-active{% else %}text-gray-500 hover:text-white{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                </svg>
                <span class="text-[10px] font-bold mt-1 tracking-wider uppercase">Match</span>
            </a>

            <a href="{% url 'likes_list' %}" class="flex flex-col items-center p-2 rounded-xl group nav-icon {% if request.resolver_match.url_name == 'likes_list' %}nav-active{% else %}text-gray-500 hover:text-white{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.917 13A6.002 6.002 0 0119 19H5a6.002 6.002 0 016.083-6h1.834z" />
                    <path fill-rule="evenodd" d="M12 3a4 4 0 00-4 4v3h8V7a4 4 0 00-4-4z" clip-rule="evenodd" />
                </svg>
                <span class="absolute top-2 right-4 w-2 h-2 bg-pink-500 rounded-full animate-ping hidden"></span> 
                
                <span class="text-[10px] font-bold mt-1 tracking-wider uppercase">Likes</span>
            </a>

            <a href="{% url 'profile' %}" class="flex flex-col items-center p-2 rounded-xl group nav-icon {% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'settings' or request.resolver_match.url_name == 'edit_profile' %}nav-active{% else %}text-gray-500 hover:text-white{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                </svg>
                <span class="text-[10px] font-bold mt-1 tracking-wider uppercase">Me</span>
            </a>

        </nav>
    </div>
    {% endif %}
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
