{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-orange-50 flex flex-col items-center justify-center text-center p-6 pb-32">
    <div class="w-32 h-32 bg-gradient-to-br from-pink-500 to-orange-400 text-white rounded-full flex items-center justify-center mb-6 shadow-xl shadow-pink-200 animate-bounce">
        <svg class="w-16 h-16 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <p class="mb-2 text-xs font-black uppercase tracking-[0.22em] text-pink-600">{{ product.name }}</p>
    <h1 class="text-2xl font-black italic text-slate-900 uppercase mb-2 sm:text-3xl">WELCOME TO {{ premium_tier }}.</h1>
    <p class="text-slate-600 mb-2">Your {{ product.name }} pass is active.</p>
    <p class="mb-8 text-sm text-slate-500">Access expires {{ premium_expiry|date:"F j, Y H:i" }} UTC.</p>
    <a href="{% url 'swipe_card' %}" class="brand-gradient rounded-full px-8 py-3 font-black text-white shadow-lg shadow-pink-200">Start swiping</a>
</div>
{% endblock %}
