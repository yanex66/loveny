{% extends 'base.html' %}

{% block title %}LOVENY - Discover{% endblock %}

{% block extra_head %}
<style>
    /* Card Container Dimensions */
    .dating-card-wrapper {
        position: relative;
        width: 90vw;          
        max-width: 400px;     
        height: 65vh;        
        min-height: 500px;    
        max-height: 700px;    
        margin: 0 auto;       
        perspective: 1000px;
    }
    
    /* Individual Card Logic */
    .dating-card {
        transition: transform 0.1s linear, box-shadow 0.2s ease;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        overflow: hidden;
        background-color: #000; 
        user-select: none;
        cursor: grab;
        touch-action: none;
        border-radius: 2rem;
        box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);
    }
    .dating-card:active {
        cursor: grabbing;
    }

    .media-content {
        width: 100%; height: 100%; object-fit: cover; pointer-events: none;
    }

    /* Animation Classes */
    .dating-card-animate { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    /* Button Press Effect */
    .action-btn { transition: all 0.1s ease; }
    .action-btn:active { transform: scale(0.9) translateY(2px); }

    /* Loading Spinner */
    .loading-pulse {
        width: 60px; height: 60px;
        background-color: rgba(255,255,255,0.1);
        border-radius: 50%;
        animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
        75%, 100% { transform: scale(2); opacity: 0; }
    }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen relative overflow-hidden bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 font-sans flex flex-col items-center pb-24">

    <div id="config-data" 
         data-swipe-url="{{ SWIPE_URL }}" 
         data-card-url="{{ PROFILES_URL }}"
         data-rewind-url="{% url 'rewind_swipe' %}"
         data-premium-url="{% url 'premium_landing' %}"
         class="hidden"></div>

    <div class="absolute -z-10 w-96 h-96 bg-yellow-400 rounded-full mix-blend-overlay filter blur-[100px] opacity-20 top-[-100px] left-[-100px] animate-blob"></div>
    <div class="absolute -z-10 w-96 h-96 bg-pink-600 rounded-full mix-blend-overlay filter blur-[100px] opacity-20 bottom-0 right-0 animate-blob animation-delay-2000"></div>
    
    <div id="match-overlay" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[100] backdrop-blur-md transition-opacity duration-300 opacity-0">
        <div class="bg-gray-900 border border-white/10 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4 transform transition-all duration-300 scale-90 relative overflow-hidden" id="match-modal">
            
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500"></div>
            <div class="absolute -z-10 inset-0 bg-gradient-to-b from-pink-500/20 to-transparent"></div>

            <div class="text-6xl mb-4 animate-bounce">🔥</div>
            
            <h2 class="text-4xl font-black italic tracking-tighter text-white mb-2 uppercase transform -rotate-2">
                It's a Match!
            </h2>
            
            <p class="text-gray-300 mb-8 font-medium">
                You and <span id="matched-username" class="text-yellow-400 font-bold uppercase tracking-wider"></span> clicked.
            </p>
            
            <a href="{% url 'match_list' %}" class="block w-full py-4 bg-green-500 text-black font-black uppercase tracking-widest rounded-xl shadow-[0_0_20px_rgba(34,197,94,0.6)] hover:bg-green-400 transition transform hover:-translate-y-1 mb-4">
                Launch WhatsApp
            </a>
            
            <button onclick="hideMatchModal(); loadNextProfile();" class="text-xs font-bold text-gray-500 hover:text-white uppercase tracking-widest transition">
                Keep Swiping
            </button>
        </div>
    </div>
    
    <header class="w-full pt-4 pb-2 z-10 flex justify-between items-center px-6 max-w-md">
        <h1 class="text-2xl font-black italic tracking-tighter text-white">
            DISCOVER
        </h1>
        <a href="{% url 'settings' %}" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition backdrop-blur-md border border-white/10">
             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </a>
    </header>

    <main class="w-full flex-grow flex flex-col justify-center items-center p-4 relative">
        
        <div id="card-container" class="dating-card-wrapper">
            <div id="initial-loading-message" class="h-full w-full flex flex-col justify-center items-center text-center bg-black/20 backdrop-blur-md rounded-3xl border border-white/10">
                <div class="loading-pulse mb-6"></div>
                <h2 class="text-xl font-bold text-white uppercase tracking-widest">Scanning...</h2>
                <p class="text-pink-300 text-xs mt-2 font-mono">LOCATING NEARBY SIGNALS</p>
            </div>
        </div>
        
        <div id="action-buttons" class="flex justify-center items-center gap-6 mt-6 hidden">
            
            <button onclick="rewindSwipe()" 
                    class="action-btn w-12 h-12 bg-black/40 border border-yellow-500/50 text-yellow-500 rounded-full shadow-[0_0_15px_rgba(234,179,8,0.2)] hover:bg-yellow-500 hover:text-black hover:shadow-[0_0_20px_rgba(234,179,8,0.6)] flex items-center justify-center backdrop-blur-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>

            <button onclick="animateAndSwipe('PASS')" 
                    class="action-btn w-16 h-16 bg-black/40 border-2 border-red-500 text-red-500 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.3)] hover:bg-red-500 hover:text-white hover:shadow-[0_0_30px_rgba(239,68,68,0.6)] flex items-center justify-center backdrop-blur-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <button onclick="animateAndSwipe('LIKE')" 
                    class="action-btn w-20 h-20 bg-gradient-to-tr from-green-400 to-emerald-600 text-black rounded-full shadow-[0_0_20px_rgba(74,222,128,0.5)] hover:scale-105 hover:shadow-[0_0_40px_rgba(74,222,128,0.8)] flex items-center justify-center border-4 border-black/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 fill-current" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </button>
        </div>
    </main>
</div>

<script>
    // --- Config ---
    const configData = document.getElementById('config-data');
    const SWIPE_URL = configData.dataset.swipeUrl; 
    const PROFILES_URL = configData.dataset.cardUrl; 
    const REWIND_URL = configData.dataset.rewindUrl; 
    const PREMIUM_URL = configData.dataset.premiumUrl;
    const csrftoken = getCookie('csrftoken');
    
    // --- Elements ---
    const matchedUsernameSpan = document.getElementById('matched-username');
    const cardContainer = document.getElementById('card-container');
    const actionButtons = document.getElementById('action-buttons');
    const loadingMsg = document.getElementById('initial-loading-message');
    
    // --- State ---
    let profileQueue = []; 
    let currentCardEl = null;
    let isFetching = false;
    let isDragging = false;
    let startX = 0;

    window.onload = function() {
        fetchProfilesBatch();
    };

    async function fetchProfilesBatch() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch(PROFILES_URL);
            const data = await response.json();
            
            if (data.profiles && data.profiles.length > 0) {
                const currentId = currentCardEl ? currentCardEl.dataset.targetId : null;
                data.profiles.forEach(p => {
                    if (p.id != currentId && !profileQueue.some(q => q.id === p.id)) {
                        profileQueue.push(p);
                    }
                });
                if (!currentCardEl) {
                    if(loadingMsg) loadingMsg.style.display = 'none';
                    renderNextCard();
                }
            } else {
                 if (!currentCardEl && profileQueue.length === 0) showNoMoreProfiles();
            }
        } catch (err) {
            console.error("Batch fetch error:", err);
        } finally {
            isFetching = false;
        }
    }

    function renderNextCard() {
        if (profileQueue.length === 0) {
            if (!isFetching) {
                 fetchProfilesBatch().then(() => {
                     if (profileQueue.length === 0) showNoMoreProfiles();
                 });
            }
            return; 
        }

        const profile = profileQueue.shift();
        if (!profile) return;

        const newCard = document.createElement('div');
        newCard.id = 'current-card';
        newCard.className = 'dating-card bg-gray-900 border-2 border-white/10 shadow-2xl flex flex-col justify-end group';
        newCard.dataset.targetUsername = profile.username;
        newCard.dataset.targetId = profile.id;
        
        let mediaHtml = '';
        if (profile.is_video) {
            mediaHtml = `<video src="${profile.image_url}" class="media-content opacity-90" autoplay muted loop playsinline></video>`;
        } else if (profile.image_url) {
            mediaHtml = `<img src="${profile.image_url}" class="media-content opacity-90">`;
        } else {
            mediaHtml = `<div class="w-full h-full bg-gray-800 flex items-center justify-center"><span class="text-gray-500 font-bold uppercase tracking-widest">No Signal</span></div>`;
        }

        let tagsHtml = '';
        profile.tags.forEach(tag => {
            tagsHtml += `<span class="bg-black/50 backdrop-blur-md text-white text-[10px] font-bold px-2 py-1 rounded border border-white/20 mr-1 uppercase tracking-wider shadow-sm">#${tag}</span>`;
        });

        // --- NEW: ONLINE INDICATOR HTML ---
        let onlineBadge = '';
        if (profile.is_online) {
            onlineBadge = `
            <div class="absolute top-4 right-4 z-10">
                <div class="bg-green-500/90 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-full shadow-lg backdrop-blur-md flex items-center gap-2 border border-white/20">
                    <span class="w-2 h-2 bg-white rounded-full animate-pulse shadow-[0_0_10px_rgba(255,255,255,0.8)]"></span>
                    ONLINE
                </div>
            </div>`;
        }

        newCard.innerHTML = `
            ${mediaHtml}
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
            
            <div onclick="viewProfile(${profile.id})" class="absolute bottom-0 left-0 right-0 p-6 cursor-pointer z-10">
                <h2 class="text-4xl font-black text-white leading-none mb-1 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] italic uppercase">
                    ${profile.username} <span class="text-pink-500 not-italic text-3xl font-bold ml-1">${profile.age}</span>
                </h2>
                ${profile.job_title ? `<p class="text-gray-300 text-xs font-bold uppercase tracking-widest mb-3 opacity-80">${profile.job_title}</p>` : ''}
                <div class="flex flex-wrap gap-1 mb-4">${tagsHtml}</div>
                <p class="text-sm text-gray-200 line-clamp-2 mb-4 font-medium leading-relaxed opacity-90 border-l-2 border-yellow-400 pl-3">${profile.bio}</p>
                ${profile.first_date_idea ? `
                <div class="bg-white/10 backdrop-blur-md rounded-xl p-3 border border-white/10">
                    <p class="text-[9px] font-bold text-yellow-400 uppercase tracking-widest mb-1">Mission / Date Idea</p>
                    <p class="text-xs text-white italic">"${profile.first_date_idea}"</p>
                </div>` : ''}
            </div>
            
            <div class="absolute top-4 left-4 z-10">
                <div class="bg-red-600/90 text-white text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-lg backdrop-blur-sm animate-pulse">LIVE</div>
            </div>
            
            ${onlineBadge} `;

        cardContainer.innerHTML = '';
        cardContainer.appendChild(newCard);
        currentCardEl = newCard;
        attachDragListeners(currentCardEl);
        
        actionButtons.classList.remove('hidden');
        actionButtons.style.display = 'flex';

        if (profileQueue.length < 3) fetchProfilesBatch();
    }
    
    function viewProfile(id) {
        window.location.href = `/users/${id}/`;
    }

    function showNoMoreProfiles() {
         cardContainer.innerHTML = `
            <div class="h-full w-full flex flex-col justify-center items-center text-center bg-black/30 backdrop-blur-xl rounded-3xl border border-white/10 p-8">
                <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-6 shadow-xl border-4 border-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-black text-white uppercase italic tracking-tighter mb-2">Sector Clear</h1>
                <p class="text-gray-400 text-sm mb-8 font-medium max-w-[200px]">No more signals in your area. Check back later.</p>
                <a href="{% url 'match_list' %}" class="px-8 py-4 bg-pink-600 text-white font-black uppercase tracking-widest rounded-xl shadow-lg hover:bg-pink-500 transition border-2 border-transparent hover:border-white">View Matches</a>
            </div>`;
        actionButtons.style.display = 'none';
        currentCardEl = null;
    }

    function loadNextProfile() {
         renderNextCard();
    }

    async function performSwipe(action, targetId, targetUsername) {
        if (!targetId) return;
        fetch(SWIPE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify({ 'target_user_id': targetId, 'action': action })
        })
        .then(r => r.json())
        .then(data => {
            if (data.is_match) {
                showMatchModal(targetUsername);
            } else if (data.message === 'limit_reached_likes') {
                if(confirm("Daily Like Limit Reached (100). Upgrade to Premium for Unlimited Likes?")) {
                    window.location.href = PREMIUM_URL;
                }
                // Don't advance card if failed
                return; 
            }
        })
        .catch(err => console.error(err));
        loadNextProfile();
    }

    function rewindSwipe() {
        fetch(REWIND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                profileQueue.unshift(data.profile);
                renderNextCard(); 
            } else if (data.message === 'premium_required') {
                if(confirm("Rewind is a Premium feature. Upgrade now?")) {
                    window.location.href = PREMIUM_URL;
                }
            } else if (data.message === 'limit_reached') {
                alert("You can only rewind your last action! Swipe again to enable rewind.");
            } else if (data.message === 'no_swipes') {
                alert("Nothing to rewind!");
            }
        });
    }

    function animateAndSwipe(action) {
        if (!currentCardEl) return;
        const tid = currentCardEl.dataset.targetId;
        const tname = currentCardEl.dataset.targetUsername;
        
        currentCardEl.classList.add('dating-card-animate');
        const translate = action === 'LIKE' ? 'translateX(150%) rotate(30deg)' : 'translateX(-150%) rotate(-30deg)';
        currentCardEl.style.transform = translate;
        currentCardEl.style.opacity = '0'; 
        
        setTimeout(() => performSwipe(action, tid, tname), 200);
    }

    function dragStart(e) {
        if (!currentCardEl) return;
        isDragging = true;
        startX = e.clientX || e.touches[0].clientX;
        currentCardEl.classList.remove('dating-card-animate');
    }

    function dragMove(e) {
        if (!isDragging || !currentCardEl) return;
        const currentX = e.clientX || e.touches[0].clientX;
        const deltaX = currentX - startX;
        const rotation = deltaX / 15;
        currentCardEl.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;
        
        if (deltaX > 50) {
            currentCardEl.style.borderColor = '#4ade80'; 
        } else if (deltaX < -50) {
            currentCardEl.style.borderColor = '#ef4444'; 
        } else {
             currentCardEl.style.borderColor = 'rgba(255,255,255,0.1)';
        }
        if (e.touches && Math.abs(deltaX) > 5) e.preventDefault();
    }

    function dragEnd(e) {
        if (!isDragging || !currentCardEl) return;
        isDragging = false;
        currentCardEl.classList.add('dating-card-animate');
        const style = window.getComputedStyle(currentCardEl);
        const matrix = new WebKitCSSMatrix(style.transform);
        const currentDeltaX = matrix.m41; 

        if (currentDeltaX > 100) animateAndSwipe('LIKE');
        else if (currentDeltaX < -100) animateAndSwipe('PASS');
        else {
            currentCardEl.style.transform = 'translateX(0) rotate(0deg)';
            currentCardEl.style.opacity = '1';
            currentCardEl.style.borderColor = 'rgba(255,255,255,0.1)';
        }
    }

    function attachDragListeners(card) {
        card.addEventListener('mousedown', dragStart);
        card.addEventListener('touchstart', dragStart, { passive: true });
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function showMatchModal(username) {
        matchedUsernameSpan.textContent = username; 
        const modal = document.getElementById('match-modal');
        const overlay = document.getElementById('match-overlay');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        setTimeout(() => {
            overlay.style.opacity = '1';
            modal.style.transform = 'scale(1)';
        }, 50);
    }

    function hideMatchModal() {
        const modal = document.getElementById('match-modal');
        const overlay = document.getElementById('match-overlay');
        overlay.style.opacity = '0';
        modal.style.transform = 'scale(0.9)';
        setTimeout(() => {
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }, 300);
    }
</script>
{% endblock %}
