{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" href="{% static 'dating/images/loveny-logo.png' %}">
    <title>LOVENY - All Caught Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
        body { background: #fff8fc; color: #35162f; }
        .brand-gradient { background-image: linear-gradient(115deg, #ec4899, #fb7185 48%, #fb923c); }
        a[class*="bg-"]:hover {
            background-image: none !important;
            background-color: #fff !important;
            border: 1px solid #f9a8d4;
            color: #35162f !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center overflow-x-hidden px-4 pt-[env(safe-area-inset-top)] pb-[max(6rem,calc(6rem+env(safe-area-inset-bottom)))] font-sans bg-gradient-to-br from-rose-50 via-white to-orange-50">
    <div class="max-w-md w-full text-center p-8 bg-white rounded-3xl shadow-2xl border border-pink-100">
        <img src="{% static 'dating/images/loveny-logo.png' %}" alt="LOVENY" class="mx-auto mb-6 h-12 w-auto max-w-full rounded-lg object-contain">
        <h1 class="text-2xl font-black text-pink-700 mb-4 sm:text-3xl">You're all caught up!</h1>
        <p class="text-lg text-slate-600 mb-6">
            Looks like you've seen every available profile based on your preferences and location.
        </p>
        <p class="text-slate-500 mb-8">
            Check back soon, or adjust your filtering settings to find new matches!
        </p>
        <a href="{% url 'match_list' %}" class="inline-block px-6 py-3 brand-gradient text-white font-semibold rounded-lg shadow-md hover:brightness-105 transition duration-150">
            Go to Matches
        </a>
    </div>
</body>
</html>
