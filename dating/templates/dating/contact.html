{% extends 'base.html' %}

{% block title %}LOVENY - Support{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-900 font-sans pb-24 px-6 py-12 flex flex-col items-center justify-center text-center">

    <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-6 border-2 border-pink-500">
        <svg class="w-10 h-10 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    </div>

    <h1 class="text-3xl font-black text-white italic uppercase mb-2">Need Help?</h1>
    <p class="text-gray-400 text-sm mb-8 max-w-xs mx-auto">
        Having trouble with your account or payment? Our support team in Lagos is ready to assist.
    </p>

    <div class="w-full max-w-sm space-y-4">
        <a href="mailto:support@loveny.ng" class="block w-full py-4 bg-white text-black font-bold rounded-xl shadow-lg hover:bg-gray-200 transition">
            Email Support
        </a>
        
        <a href="https://wa.me/2348000000000" class="block w-full py-4 bg-[#25D366] text-white font-bold rounded-xl shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326z"/></svg>
            Chat on WhatsApp
        </a>
    </div>

    <button onclick="history.back()" class="mt-8 text-gray-500 text-xs font-bold uppercase tracking-widest hover:text-white transition">
        Cancel & Return
    </button>

</div>
{% endblock %}
