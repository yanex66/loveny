{% extends 'base.html' %}

{% block title %}LOVENY - Support{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-900 font-sans pb-24 px-6 py-12 flex flex-col items-center justify-center text-center">
    <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-6 border-2 border-pink-500">
        <svg class="w-10 h-10 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h8M8 14h5m-8 6 2.5-3H18a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v14z"/>
        </svg>
    </div>

    <h1 class="text-3xl font-black text-white italic uppercase mb-2">Need Help?</h1>
    <p class="text-gray-400 text-sm mb-8 max-w-xs mx-auto">
        Having trouble with your account or payment? Our support team in Lagos is ready to assist.
    </p>

    <a href="https://wa.me/2349130273282?text=Hello%20Loveny%20Support,%20I%20need%20help%20with%20my%20account"
       target="_blank" rel="noopener noreferrer"
       class="flex min-h-14 w-full max-w-sm items-center justify-center gap-3 rounded-2xl bg-[#25D366] px-6 py-4 text-base font-bold text-white shadow-lg transition hover:bg-emerald-600">
        <svg class="h-5 w-5" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326z"/>
        </svg>
        Chat on WhatsApp
    </a>

    <button onclick="history.back()" class="mt-8 text-gray-500 text-xs font-bold uppercase tracking-widest hover:text-white transition">
        Cancel &amp; Return
    </button>
</div>
{% endblock %}
